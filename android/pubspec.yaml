name: markdown_editor
description: "MarkdownIsAllYouNeed Android client — Flutter port of iOS v0.5.0"
publish_to: 'none'

version: 0.6.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  webview_flutter: ^4.10.0
  flutter_web_auth_2: ^4.0.1
  crypto: ^3.0.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/editor/
